# Portainer stack "center-dashboard" on rackintosh-docker (Git-backed, builds this repository).
# It joins hermes-agent_default to reach the local Harness (local-ai-harness:8797) and
# JARVIS (hermes:8770) by name, and publishes only on the LAN and tailnet addresses, plus
# localhost for the cloudflared tunnel (host network) behind center.kismagyarorszag.com.
# Connections and their tokens are entered in Settings and kept encrypted in the volume.
# harness-relay makes JARVIS' main Harness reachable as http://hermes:8788 (see below).
services:
  dashboard:
    build: ..
    image: center-dashboard:local
    restart: unless-stopped
    environment:
      JARVIS_TRUST_PROXY: cloudflare
    ports:
      - "192.168.1.18:8790:8790"
      - "100.101.246.117:8790:8790"
      - "127.0.0.1:8790:8790"
    volumes:
      - data:/data
    networks: [hermes]

  # The main Harness (OpenAI subscription models) listens only on 127.0.0.1:8787 inside the
  # "hermes" container. This relay shares that container's network and offers it as hermes:8788
  # on hermes-agent_default; the Harness still requires its bearer token. If "hermes" is
  # recreated, redeploy this stack so the relay joins the new container.
  harness-relay:
    image: alpine/socat:latest
    restart: unless-stopped
    network_mode: "container:hermes"
    command: ["TCP-LISTEN:8788,fork,reuseaddr", "TCP:127.0.0.1:8787"]

volumes:
  data:

networks:
  hermes:
    name: hermes-agent_default
    external: true
