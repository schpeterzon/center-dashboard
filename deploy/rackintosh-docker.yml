# Portainer stack "center-dashboard" on rackintosh-docker (Git-backed, builds this repository).
# It joins hermes-agent_default to reach the local Harness (local-ai-harness:8797) and
# JARVIS (hermes:8770) by name, and publishes only on the LAN and tailnet addresses, plus
# localhost for the cloudflared tunnel (host network) behind center.kismagyarorszag.com.
# Connections and their tokens are entered in Settings and kept encrypted in the volume.
# harness-relay makes JARVIS' main Harness reachable as http://hermes:8788 (see below).
services:
  dashboard:
    build: ..
    image: center-dashboard:local
    restart: unless-stopped
    environment:
      JARVIS_TRUST_PROXY: cloudflare
    ports:
      - "192.168.1.18:8790:8790"
      - "100.101.246.117:8790:8790"
      - "127.0.0.1:8790:8790"
    volumes:
      - data:/data
    networks: [hermes]

  # The main Harness (OpenAI subscription models) listens only on 127.0.0.1:8787 inside the
  # "hermes" container and accepts only its own host name. This relay shares that container's
  # network, offers it as hermes:8788 on hermes-agent_default and presents the expected host;
  # the Harness still requires its bearer token. If "hermes" is recreated, redeploy this stack.
  harness-relay:
    image: nginx:alpine
    restart: unless-stopped
    network_mode: "container:hermes"
    command:
      - sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'CONF'
        server {
          listen 8788;
          location / {
            proxy_pass http://127.0.0.1:8787;
            proxy_set_header Host 127.0.0.1:8787;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_read_timeout 120s;
            proxy_buffering off;
          }
        }
        map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
        CONF
        exec nginx -g 'daemon off;'

volumes:
  data:

networks:
  hermes:
    name: hermes-agent_default
    external: true
